org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false

# ── Ajouté le 2026-09-12 ────────────────────────────────────────────────────
# Échecs répétés et reproductibles sur un seul fichier volumineux
# (kotlin-compiler-embeddable-2.1.20.jar, ~80 Mo) sur connexion instable —
# le reste (Firebase, Guava, desugar) passe. Ce fichier n'est téléchargé que
# pour le snapshot de classpath de la "Kotlin Build Tools API" (compilation
# incrémentale) — on désactive ce mécanisme, inutile ici, plutôt que de
# dépendre d'un téléchargement de 80 Mo qui timeout.
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.execution.strategy=in-process

# Délais et re-essais réseau de Gradle relevés (défaut trop court pour un
# gros fichier sur connexion lente/instable).
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500
