[build]
  publish = "build/web"
  command = "flutter build web --release"

[[plugins]]
  # Netlify n'a pas Flutter préinstallé sur son image de build — ce plugin
  # l'installe avant la commande de build. Sans lui, `flutter build web`
  # échoue avec "flutter: command not found".
  package = "netlify-plugin-flutter"

  [plugins.inputs]
    channel = "stable"

# Indispensable pour une SPA : sans ça, rafraîchir l'app sur une route type
# /community ou /profile renvoie un 404 Netlify au lieu de laisser GoRouter
# gérer la navigation côté client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # Le service worker Firebase DOIT être servi depuis la racine, sans cache
  # agressif, sinon les navigateurs continuent d'utiliser une version périmée
  # après un déploiement.
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# ⚠️ Fichiers "bootstrap" de Flutter web — leur nom ne change JAMAIS d'un
# déploiement à l'autre (contrairement aux assets dans /assets/, qui ont un
# hash dans leur nom et peuvent donc être mis en cache indéfiniment sans
# risque). Sans ces règles, le CDN de Netlify peut continuer à servir une
# ancienne version compilée du code à TOUS les visiteurs — y compris un
# appareil neuf n'ayant jamais rien mis en cache lui-même — jusqu'à
# expiration naturelle du cache, quel que soit le nombre de redéploiements
# effectués entre-temps.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"